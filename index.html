<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Task Calendar & Countdown</title>
    <meta name="description" content="A minimalist calendar to schedule tasks on any date with real-time countdown timers and an AI Auto-Scheduler agent." />
    <meta property="og:title" content="Task Calendar & Countdown" />
    <meta property="og:description" content="A minimalist calendar to schedule tasks on any date with real-time countdown timers and an AI Auto-Scheduler agent." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      // Apply the saved/system theme before paint to avoid a light-mode flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {
          // ignore (private browsing / storage disabled)
        }
      })();
    </script>
  </head>
  <body class="bg-white text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white dark:bg-zinc-900 dark:text-zinc-50 dark:selection:bg-zinc-100 dark:selection:text-zinc-900 font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
